<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A33" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cubeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Shield Glow -->
  <circle cx="80" cy="80" r="76" fill="#0B152D" />

  <!-- Isometric Hex Cube Intermodal Container -->
  <!-- Top Face -->
  <polygon points="80,24 132,54 80,84 28,54" fill="url(#cubeGrad1)" />
  
  <!-- Left Face -->
  <polygon points="28,54 80,84 80,136 28,106" fill="url(#cubeGrad2)" />
  
  <!-- Right Face -->
  <polygon points="80,84 132,54 132,106 80,136" fill="url(#cubeGrad3)" />

  <!-- Speed Lines / V-Wing Vanguard Cutout -->
  <path d="M42,52 L80,74 L118,52" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M52,66 L80,82 L108,66" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Center Axis Accent -->
  <circle cx="80" cy="84" r="5" fill="#FFFFFF" />
</svg>
